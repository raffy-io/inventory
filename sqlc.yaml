version: "2"
sql:
  - engine: "postgresql"
    queries: "database/sql"
    schema: "database/migration"
    gen:
      go:
        package: "inventoryDB"
        out: "internal/db"
        sql_package: "pgx/v5"
        overrides:
          # --- NUMERIC OVERRIDES ---
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"

          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type: "github.com/shopspring/decimal.NullDecimal"
